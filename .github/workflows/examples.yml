name: examples

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'info'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install apt-get packages
      run: |
        sudo apt-get update
        sudo apt-get install -y wget git curl software-properties-common build-essential

    - name: Install latest Rust and wasm target
      run: |
        rustup update stable
        rustup target add wasm32-wasip1

    - name: Install latest WasmEdge
      run: |
        curl -sSf https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install.sh | sudo bash -s -- -p /usr/local

    - name: Client example
      env:
        CC_wasm32_wasip1: clang-14
      run: |
        cargo build --target wasm32-wasip1 --release
        wasmedge compile target/wasm32-wasip1/release/http.wasm http.wasm
        wasmedge compile target/wasm32-wasip1/release/https.wasm https.wasm
        resp=$(wasmedge http.wasm 2>&1) || true
        echo "$resp"
        if [[ $resp == *"WasmEdge"* ]]; then
          echo -e "Execution Success!"
        else
          echo -e "Execution Fail!"
          exit 1
        fi

        resp=$(wasmedge https.wasm 2>&1) || true
        echo "$resp"
        if [[ $resp == *"WasmEdge"* ]]; then
          echo -e "Execution Success!"
        else
          echo -e "Execution Fail!"
          exit 1
        fi
